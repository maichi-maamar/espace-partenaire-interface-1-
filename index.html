<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Validation Montant Partenaire Dynamique</title>
<style>
body { font-family: Arial, sans-serif; padding: 20px; }
label { margin-right: 10px; }
input[type=text] { width: 120px; }
button { padding: 5px 10px; margin-left: 5px; }
#interfacePartenaire { display:none; margin-top:20px; }
#historique { border-collapse: collapse; width: 100%; margin-top: 10px; }
#historique th, #historique td { border: 1px solid #333; padding: 5px; text-align: center; }
</style>
</head>
<body>

<h2>Validation Montant Partenaire Dynamique</h2>

<div>
  <label>Votre ID Partenaire :</label>
  <input type="text" id="idPartenaire" placeholder="Ex: P123">
  <button onclick="chargerPartenaire()">Valider ID</button>
</div>

<div id="interfacePartenaire">
  <p id="nomPartenaire"></p>
  <p>Total dépensé chez vous : <span id="totalDepense">0</span> DA</p>
  <button onclick="entrerMontant()">Entrer Montant</button>

  <h3>Historique des transactions</h3>
  <table id="historique">
    <thead>
      <tr>
        <th>Nom Chauffeur</th>
        <th>Montant (DA)</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
// Configuration Google Sheets via Apps Script Web App
const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbz2jR-fy82q5F_SnSrLFd0hbWtddmw23z2tHbn3iM1Pme84I38ukdr9iQHcJbCfLibOIw/exec"; // Web App pour export automatique

// Données locales
let partenaires = {"P123":"Partenaire A","P456":"Partenaire B"}; // exemple, peut être chargé depuis Sheets
let transactions = []; // en mémoire
let idConnecte = "";

// Valider ID partenaire
function chargerPartenaire() {
  const id = document.getElementById('idPartenaire').value.trim();
  if(!id || !partenaires[id]){
    alert("ID Partenaire invalide !");
    return;
  }
  idConnecte = id;
  document.getElementById('nomPartenaire').textContent = "Partenaire : " + partenaires[id];
  document.getElementById('interfacePartenaire').style.display = "block";
  updateTotalDepense();
  updateHistorique();
}

// Bouton Entrer Montant
function entrerMontant() {
  const montant = parseFloat(prompt("Entrez le montant dépensé (DA) :"));
  if(!montant || montant <=0){ alert("Montant invalide"); return; }
  const nomChauffeur = prompt("Nom du chauffeur :");
  if(!nomChauffeur){ alert("Nom obligatoire"); return; }
  const date = new Date().toISOString().slice(0,10);

  // Ajouter en mémoire
  transactions.push({id:idConnecte, nomChauffeur, montant, date});
  updateTotalDepense();
  updateHistorique();
  
  // Envoyer automatiquement à Google Sheets via Apps Script
  fetch(URL_APPS_SCRIPT,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({transactions:[{id:idConnecte, nomChauffeur, montant, date}]})
  }).then(res=>res.json())
    .then(data=>{
      if(data.success){
        console.log("Transaction enregistrée sur Google Sheets");
      } else {
        console.error("Erreur export Google Sheets:", data.message);
      }
    }).catch(err=>console.error(err));
}

// Mettre à jour total dépensé
function updateTotalDepense(){
  let total = 0;
  transactions.forEach(t=>{ if(t.id===idConnecte) total+=t.montant; });
  document.getElementById('totalDepense').textContent = total;
}

// Mettre à jour l'historique
function updateHistorique(){
  const tbody = document.querySelector('#historique tbody');
  tbody.innerHTML = "";
  transactions.forEach(t=>{
    if(t.id===idConnecte){
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${t.nomChauffeur}</td><td>${t.montant}</td><td>${t.date}</td>`;
      tbody.appendChild(tr);
    }
  });
}
</script>

</body>
</html>
