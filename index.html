<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Interface Partenaire</title>
<style>
body { font-family: Arial; text-align:center; background:#f4f6f9; }
.container { margin-top:40px; }
button { padding:12px 20px; margin:10px; border:none; border-radius:8px; cursor:pointer; }
.primary { background:#2563eb; color:white; }
.success { background:#16a34a; color:white; }
input { padding:10px; margin:10px; border-radius:6px; border:1px solid #ccc; }
.hidden { display:none; }
.card { background:white; padding:20px; margin:auto; width:320px; border-radius:12px; box-shadow:0 5px 15px rgba(0,0,0,0.1); }
</style>
</head>

<body>

<div class="container">

<div id="login">
    <h2>Connexion Partenaire</h2>
    <input type="password" id="partnerCode" placeholder="Code partenaire">
    <br>
    <button class="primary" onclick="login()">Valider</button>
</div>

<div id="scanPage" class="hidden">
<div class="card">
    <h3>Scanner Carte Chauffeur</h3>
    <button class="primary" onclick="scanCard()">Scanner NFC</button>

    <p>ID : <span id="driverId"></span></p>
    <p>Nom : <span id="driverName"></span></p>
    <p>Prénom : <span id="driverSurname"></span></p>

    <input type="number" id="amount" placeholder="Montant" disabled>
    <button id="validateBtn" class="success hidden" onclick="validateAmount()">Valider</button>
</div>
</div>

<div id="partnerHome" class="hidden">
    <h2>Transaction enregistrée</h2>
    <h1 id="lastAmount" style="color:green;"></h1>
    <button onclick="newTransaction()">Nouvelle transaction</button>
</div>

</div>

<script>

let currentPartner = "";
const scriptURL = "https://script.google.com/macros/s/AKfycbxjKCay86qSSZJV7Q_nPT7Pg3zZ2EaVxDF9kOAcRXEljwUHUs3TOh3PP3TjphYUkzDXYA/exec";

function login(){
    currentPartner = document.getElementById("partnerCode").value;
    document.getElementById("login").classList.add("hidden");
    document.getElementById("scanPage").classList.remove("hidden");
}

async function scanCard(){
    if ('NDEFReader' in window) {
        const ndef = new NDEFReader();
        await ndef.scan();
        ndef.onreading = event => {
            const decoder = new TextDecoder();
            const data = decoder.decode(event.message.records[0].data);
            const driver = JSON.parse(data);

            document.getElementById("driverId").textContent = driver.driverId;
            document.getElementById("driverName").textContent = driver.nom;
            document.getElementById("driverSurname").textContent = driver.prenom;

            document.getElementById("amount").disabled = false;
            document.getElementById("validateBtn").classList.remove("hidden");
        };
    } else {
        alert("NFC non supporté");
    }
}

function validateAmount(){

    const montant = document.getElementById("amount").value;
    if(montant === "") return alert("Entrer un montant");

    fetch(scriptURL, {
        method: "POST",
        body: JSON.stringify({
            partner: currentPartner,
            driverId: document.getElementById("driverId").textContent,
            nom: document.getElementById("driverName").textContent,
            prenom: document.getElementById("driverSurname").textContent,
            montant: montant
        })
    })
    .then(res => res.json())
    .then(data => {
        if(data.status === "success"){
            document.getElementById("scanPage").classList.add("hidden");
            document.getElementById("partnerHome").classList.remove("hidden");
            document.getElementById("lastAmount").textContent = montant + " DA";
        }
    });

    document.getElementById("amount").disabled = true;
}

function newTransaction(){
    document.getElementById("partnerHome").classList.add("hidden");
    document.getElementById("scanPage").classList.remove("hidden");
    document.getElementById("amount").value="";
    document.getElementById("amount").disabled=true;
}

</script>

</body>
</html>
