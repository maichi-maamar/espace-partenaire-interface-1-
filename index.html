<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Validation Montant Partenaire</title>
<style>
body { font-family: Arial, sans-serif; padding: 20px; }
label { margin-right: 10px; }
input[type=number] { width: 120px; }
button { padding: 5px 10px; margin-left: 5px; }
.valid { background-color: #d3ffd3; }
</style>
</head>
<body>

<h2>Validation Montant Partenaire</h2>

<div>
  <label>Votre ID Partenaire :</label>
  <input type="text" id="idPartenaire" placeholder="Ex: P123">
  <button onclick="chargerPartenaire()">Valider ID</button>
</div>

<div id="interfacePartenaire" style="display:none; margin-top:20px;">
  <p id="nomPartenaire"></p>
  <label>Montant dépensé (DA) :</label>
  <input type="number" id="montantDepense">
  <button onclick="ajouterDepense()">Valider Montant</button>
  <p id="totalDepense">Total dépensé chez vous : 0 DA</p>

  <h3>Historique des transactions</h3>
  <table id="historique" border="1" cellpadding="5">
    <thead>
      <tr>
        <th>Nom Chauffeur</th>
        <th>Montant (DA)</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
// Configuration Google Sheets
const SHEET_ID = "TON_SHEET_ID";
const RANGE_PARTENAIRES = "Partenaires!A:B";
const RANGE_TRANSACTIONS = "Transactions!A:D";
const API_KEY = "TON_API_KEY";

// Données locales
let partenaires = {};
let transactions = [];
let idConnecte = "";

// Charger partenaires et transactions
async function loadPartenaires() {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${RANGE_PARTENAIRES}?key=${API_KEY}`;
  const res = await fetch(url);
  const data = await res.json();
  if(data.values){
    data.values.forEach(row => { partenaires[row[0]] = row[1]; });
  }
}

async function loadTransactions() {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${RANGE_TRANSACTIONS}?key=${API_KEY}`;
  const res = await fetch(url);
  const data = await res.json();
  transactions = [];
  if(data.values){
    data.values.forEach(row=>{
      transactions.push({id:row[0], nomChauffeur:row[1], montant:parseFloat(row[2]), date:row[3]});
    });
  }
}

// Valider ID partenaire
async function chargerPartenaire() {
  await loadPartenaires();
  await loadTransactions();
  const id = document.getElementById('idPartenaire').value.trim();
  if(!id || !partenaires[id]){
    alert("ID Partenaire invalide !");
    return;
  }
  idConnecte = id;
  document.getElementById('nomPartenaire').textContent = "Partenaire : " + partenaires[id];
  document.getElementById('interfacePartenaire').style.display = "block";
  updateTotalDepense();
  updateHistorique();
}

// Ajouter nouvelle dépense (figée)
function ajouterDepense() {
  const montant = parseFloat(document.getElementById('montantDepense').value);
  if(!montant || montant <=0){ alert("Montant invalide"); return; }

  const nomChauffeur = prompt("Nom du chauffeur ?");
  if(!nomChauffeur){ alert("Nom du chauffeur obligatoire"); return; }

  const date = new Date().toISOString().slice(0,10);

  // Vérifier doublon exact du même chauffeur à la même date
  const existe = transactions.find(t=>t.id===idConnecte && t.nomChauffeur===nomChauffeur && t.date===date);
  if(existe){
    alert("Cette dépense est déjà enregistrée et figée !");
    return;
  }

  // Ajouter transaction figée
  transactions.push({id:idConnecte, nomChauffeur, montant, date});

  // Désactiver champ pour ce chauffeur ce jour
  document.getElementById('montantDepense').value = "";
  updateTotalDepense();
  updateHistorique();
  alert("Montant validé et figé !");
}

// Mettre à jour total dépensé
function updateTotalDepense(){
  let total = 0;
  transactions.forEach(t => { if(t.id===idConnecte) total += t.montant; });
  document.getElementById('totalDepense').textContent = "Total dépensé chez vous : " + total + " DA";
}

// Mettre à jour l'historique
function updateHistorique(){
  const tbody = document.querySelector('#historique tbody');
  tbody.innerHTML = "";
  transactions.forEach(t=>{
    if(t.id===idConnecte){
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${t.nomChauffeur}</td><td>${t.montant}</td><td>${t.date}</td>`;
      tbody.appendChild(tr);
    }
  });
}
</script>

</body>
</html>
