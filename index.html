<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interface Partenaire</title>
<style>
body {
    font-family: Arial;
    text-align: center;
    background: #f5f7fa;
}
.container {
    margin-top: 50px;
}
button {
    padding: 12px 20px;
    margin: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
.primary {
    background: #2563eb;
    color: white;
}
.success {
    background: #16a34a;
    color: white;
}
input {
    padding: 10px;
    margin: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
}
.hidden {
    display: none;
}
.card {
    background: white;
    padding: 20px;
    margin: 20px auto;
    width: 300px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<div class="container">

    <!-- PAGE 1 -->
    <div id="page1">
        <button class="primary" onclick="showLogin()">Entrer Code Partenaire</button>
    </div>

    <!-- PAGE 2 -->
    <div id="page2" class="hidden">
        <h3>Code Partenaire</h3>
        <input type="password" id="partnerCode" placeholder="Entrer votre code">
        <br>
        <button class="primary" onclick="checkCode()">Valider</button>
    </div>

    <!-- PAGE 3 -->
    <div id="page3" class="hidden">

        <div class="card">
            <h3>Scanner Carte Chauffeur</h3>
            <button class="primary" onclick="scanCard()">Scanner NFC</button>

            <p><b>ID :</b> <span id="driverId"></span></p>
            <p><b>Nom :</b> <span id="driverName"></span></p>
            <p><b>Prénom :</b> <span id="driverSurname"></span></p>

            <hr>

            <input type="number" id="amount" placeholder="Montant d'achat" disabled>
            <br>
            <button class="success hidden" id="validateBtn" onclick="validateAmount()">Valider Montant</button>

        </div>

    </div>

</div>

<script>

const validPartners = ["P001","P002","P003"];

function showLogin(){
    document.getElementById("page1").classList.add("hidden");
    document.getElementById("page2").classList.remove("hidden");
}

function checkCode(){
    const code = document.getElementById("partnerCode").value;

    if(validPartners.includes(code)){
        document.getElementById("page2").classList.add("hidden");
        document.getElementById("page3").classList.remove("hidden");
    }else{
        alert("Code invalide");
    }
}

async function scanCard(){

    if ('NDEFReader' in window) {

        const ndef = new NDEFReader();
        await ndef.scan();

        ndef.onreading = event => {

            const decoder = new TextDecoder();

            for (const record of event.message.records) {
                const data = decoder.decode(record.data);

                const driver = JSON.parse(data);

                document.getElementById("driverId").textContent = driver.id;
                document.getElementById("driverName").textContent = driver.nom;
                document.getElementById("driverSurname").textContent = driver.prenom;

                document.getElementById("amount").disabled = false;
                document.getElementById("validateBtn").classList.remove("hidden");
            }
        };

    } else {
        alert("NFC non supporté sur ce téléphone");
    }
}

function validateAmount(){
    const amountInput = document.getElementById("amount");

    if(amountInput.value === ""){
        alert("Entrer un montant");
        return;
    }

    amountInput.disabled = true;
    document.getElementById("validateBtn").classList.add("hidden");

    alert("Montant validé et figé !");
}

</script>

</body>
</html>
